[project]
name = "ugen-ai-gateway"
version = "0.1.0"
description = "Privacy-first LLM gateway: redacts personal data before prompts leave, routes between local and cloud models, and tracks usage and cost."
readme = "README.md"
license = "MIT"
authors = [
    { name = "baihu", email = "baihu3210@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "openai>=3.31.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.54.0",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
# Name and location detection (PII_NER=presidio). Also needs a spaCy model.
ner = [
    "presidio-analyzer>=2.2",
]

[project.scripts]
ugen-ai-gateway = "ugen_ai_gateway:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
